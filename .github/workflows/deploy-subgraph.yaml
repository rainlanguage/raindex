name: Deploy subgraph
on:
  workflow_dispatch:
jobs:
  deploy:
    permissions:
      contents: read
    uses: rainlanguage/rainix/.github/workflows/rainix-subgraph-deploy.yaml@main
    with:
      subgraph-name: raindex
      ormi-query-base: https://subgraph.api.ormilabs.com/api/public/9f4fc2fa-4a15-44f7-a7c1-66fdaa518a71
    # Includes ORMI_DEPLOY_KEY, from Vault secret/infra/rain/ormi (deploy_key).
    secrets: inherit
  # forwards status to telegram chat if this ci fails or gets canceled, only runs for default branch
  report:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Forward CI Status
        uses: rainlanguage/github-chore/.github/actions/telegram-status-report@main
        with:
          status: ${{ needs.deploy.result }}
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
