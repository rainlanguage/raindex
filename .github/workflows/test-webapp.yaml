name: Test webapp
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ${{ github.ref }}-webapp
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    env:
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: rainlanguage/rainix/.github/actions/checkout@main
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
      # Shared nix + cachix preamble (nix-quick-install, Cachix,
      # cache-nix-action). The third-party action SHAs are pinned once in the
      # rainix composite. checkout: false because free-disk-space runs between
      # the checkout above and nix-quick-install.
      - uses: rainlanguage/rainix/.github/actions/nix-cachix-setup@main
        with:
          checkout: false
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          gc-max-store-size-linux: 10G
      - run: |
          nix develop .#wasm-shell -c bash -c '
            set -euxo pipefail
            npm install --no-check
            npm run build -w @rainlanguage/raindex
            npm run build -w @rainlanguage/ui-components
            npm run build -w @rainlanguage/webapp
          '
        env:
          PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_PROJECT_ID || 'test' }}
          COMMIT_SHA: ${{ github.sha }}
      - run: nix develop .#wasm-shell -c npm run svelte-lint-format-check -w @rainlanguage/webapp
        env:
          PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_PROJECT_ID || 'test' }}
      - run: nix develop .#wasm-shell -c npm run test -w @rainlanguage/webapp
        env:
          PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_PROJECT_ID || 'test' }}
      # check for npm package blacklists pkgs across all packages
      - uses: rainlanguage/github-chore/.github/actions/npm-blacklist@main
      - uses: rainlanguage/github-chore/.github/actions/npm-blacklist@main
        with:
          working-directory: packages/raindex
      - uses: rainlanguage/github-chore/.github/actions/npm-blacklist@main
        with:
          working-directory: packages/ui-components
      - uses: rainlanguage/github-chore/.github/actions/npm-blacklist@main
        with:
          working-directory: packages/webapp
      # forwards status to telegram chat if this ci fails or gets canceled, only runs for default branch
      - name: Forward CI Status
        if: always()
        uses: rainlanguage/github-chore/.github/actions/telegram-status-report@main
        with:
          status: ${{ job.status }}
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
