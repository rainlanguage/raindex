name: Rainix CI
on:
  push:
    branches:
      - main
  pull_request:
concurrency:
  group: ${{ github.ref }}-rainix
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  # Solidity static analysis, license check, and tests via rainix's reusable
  # workflows. raindex's fork tests read foundry.toml rpc_endpoints, which now
  # point at rainix's *_RPC_URL env names, so map our CI_DEPLOY_* secrets onto
  # rainix's RPC_URL_*_FORK inputs.
  solidity:
    uses: rainlanguage/rainix/.github/workflows/rainix-sol.yaml@main
    secrets:
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      EXPLORER_VERIFICATION_KEY: ${{ secrets.EXPLORER_VERIFICATION_KEY }}
      CI_DEPLOY_SEPOLIA_RPC_URL: ${{ secrets.CI_DEPLOY_SEPOLIA_RPC_URL }}
      RPC_URL_ARBITRUM_FORK: ${{ secrets.CI_DEPLOY_ARBITRUM_RPC_URL }}
      RPC_URL_BASE_FORK: ${{ secrets.CI_DEPLOY_BASE_RPC_URL }}
      RPC_URL_BASE_SEPOLIA_FORK: ${{ secrets.CI_DEPLOY_BASE_SEPOLIA_RPC_URL }}
      RPC_URL_FLARE_FORK: ${{ secrets.CI_DEPLOY_FLARE_RPC_URL }}
      RPC_URL_POLYGON_FORK: ${{ secrets.CI_DEPLOY_POLYGON_RPC_URL }}
  # Assert the committed generated artifacts (src/generated pointers + meta)
  # still match a clean rebuild.
  copy-artifacts:
    uses: rainlanguage/rainix/.github/workflows/rainix-copy-artifacts.yaml@main
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
  # Rust / wasm / JS bindings run on raindex's own devshell: they need sqlite3
  # (rusqlite) and the forge-build artifacts, which the slim rainix rs reusables
  # don't provide.
  standard-tests:
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        task: [raindex-rs-test, "cargo build --release"]
        is-not-main:
          - ${{ github.ref != 'refs/heads/main' }}
        include:
          # We don't need to do rust static analysis on multiple platforms
          - os: ubuntu-latest
            task: rainix-rs-static
          # Wasm target doesnt need to run on multiple platforms
          - os: ubuntu-latest
            task: rainix-wasm-artifacts
          - os: ubuntu-latest
            task: rainix-wasm-test
          - os: ubuntu-latest
            task: rainix-wasm-browser-test
          # Testing JS/TS bindings doesnt need to run on multiple platforms
          - os: ubuntu-latest
            task: test-js-bindings
        exclude:
          - is-not-main: true
            os: macos-latest
      fail-fast: false
    runs-on: ${{ matrix.os }}
    env:
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        if: matrix.os == 'ubuntu-latest'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          large-packages: ${{ matrix.task != 'rainix-wasm-browser-test' }}
      - uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          # restore and save a cache using this key
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          # if there's no cache hit, restore a cache by this prefix
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # collect garbage until the Nix store size is at most this number
          # before trying to save a new cache
          gc-max-store-size-linux: 10G
      - run: ./pointers.sh
      - name: Run ${{ matrix.task }}
        run: nix develop -c ${{ matrix.task }}
      # forwards status to telegram chat if this ci fails or gets canceled, only runs for default branch
      - name: Forward CI Status
        if: always()
        uses: rainlanguage/github-chore/.github/actions/telegram-status-report@main
        with:
          status: ${{ job.status }}
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
