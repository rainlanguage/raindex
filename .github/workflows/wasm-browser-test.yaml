name: wasm-browser-test
on: [push]
jobs:
  wasm-browser-test:
    runs-on: ubuntu-latest
    env:
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: rainlanguage/rainix/.github/actions/checkout@main
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          # Keep chromium — wasm-pack test --headless --chrome needs it.
          large-packages: false
      # Shared nix + cachix preamble (nix-quick-install, Cachix,
      # cache-nix-action). The third-party action SHAs are pinned once in the
      # rainix composite. checkout: false because free-disk-space runs between
      # the checkout above and nix-quick-install.
      - uses: rainlanguage/rainix/.github/actions/nix-cachix-setup@main
        with:
          checkout: false
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: rainlanguage/rainix/.github/actions/rust-cache@main
        with:
          prefix-key: rust-${{ github.workflow }}
      - run: |
          nix develop .#wasm-shell -c bash -c '
            cd crates/common
            wasm-pack test --headless --chrome --features browser-tests -- leadership::wasm_tests
            wasm-pack test --headless --chrome --features browser-tests -- scheduler::wasm::wasm_tests
            wasm-pack test --headless --chrome --features browser-tests -- status::wasm::wasm_tests
            wasm-pack test --headless --chrome --features browser-tests -- retry::wasm_tests
            wasm-pack test --headless --chrome --features browser-tests -- raindex_client::local_db::wasm_tests
            wasm-pack test --headless --chrome --features browser-tests -- raindex_client::local_db::query::fetch_order_trades::wasm_tests
          '
