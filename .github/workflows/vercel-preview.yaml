##
## SECURITY MODEL FOR VERCEL PREVIEW DEPLOYS FOR INTERNAL BRANCHES (READ BEFORE EDITING)
##
## This workflow runs on non-main branch pushes in this repository (not forks):
##  - PR-target preview deploys (for forks) are isolated in a separate workflow
##    file and use a different Vercel org and project.
##  - Regardless, secrets are passed only to the Vercel CLI steps (not to build/test steps).
##  - Shell runs with 'bash --noprofile --norc -euo pipefail'.
##  - The Vercel CLI is invoked via an absolute path stored in $VERCEL_BIN to avoid PATH hijacking.
##
## WARNING: Changing any of the following may break the security model:
##  - Triggers and environment usage.
##  - Introducing PR-controlled inputs into steps that use secrets.
##  - Relaxing the shell/ PATH hardening, or calling 'vercel' via PATH.
##  - Moving secrets to top-level env or earlier steps.
## If you modify this file, re-validate these invariants.
name: GitHub Actions Vercel Preview Deployment
on:
  push:
    branches-ignore:
      - main
    # Only build/deploy a preview when something webapp-relevant changed. The
    # webapp build pulls the wasm bindings (crates/**, incl. committed abis),
    # the JS workspaces (packages/**), deps, the nix toolchain, and the build
    # script — sol-only / CI / docs / audit pushes can't change it, so skip the
    # ~30-min build for them. (Not a required check, so skipping is safe.)
    paths:
      - 'packages/**'
      - 'crates/**'
      - 'package.json'
      - 'package-lock.json'
      - 'flake.nix'
      - 'flake.lock'
      - 'script/vercel-build.sh'
      - '.github/workflows/vercel-preview.yaml'
concurrency:
  group: ${{ format('{0}-vercel-preview', github.ref) }}
  cancel-in-progress: true
jobs:
  Deploy-Preview-Push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
      - uses: nixbuild/nix-quick-install-action@5bb6a3b3abe66fd09bbf250dce8ada94f856a703 # v30
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true
      - uses: cachix/cachix-action@ad2ddac53f961de1989924296a1f236fcfbaa4fc # v15
        continue-on-error: true
        with:
          name: rainlanguage
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: false
      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@135667ec418502fa5a3598af6fb9eb733888ce6a # v6
        with:
          # restore and save a cache using this key
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          # if there's no cache hit, restore a cache by this prefix
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # collect garbage until the Nix store size (in bytes) is at most this number
          # before trying to save a new cache
          # 1G = 1073741824
          gc-max-store-size-linux: 1G
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Stable shared-key (same in vercel-prod.yaml) so preview + prod share
          # one warm wasm/cargo cache instead of a separate per-workflow one.
          shared-key: vercel-webapp
      - name: Cache npm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ github.workflow }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: ./script/vercel-build.sh
        env:
          PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.WALLETCONNECT_PROJECT_ID }}
      # check for npm package blacklists pkgs across all packages
      - uses: rainlanguage/github-chore/.github/actions/npm-blacklist@main
      - uses: rainlanguage/github-chore/.github/actions/npm-blacklist@main
        with:
          working-directory: packages/raindex
      - uses: rainlanguage/github-chore/.github/actions/npm-blacklist@main
        with:
          working-directory: packages/ui-components
      - name: Install Vercel CLI (local, pinned)
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          VERCEL_DIR="$(mktemp -d)"
          npm install --no-audit --no-fund --no-save --prefix "$VERCEL_DIR" vercel@51.8.0
          echo "VERCEL_BIN=$VERCEL_DIR/node_modules/.bin/vercel" >> "$GITHUB_ENV"
      - name: Pull Vercel Environment Information
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_V6 }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          "$VERCEL_BIN" pull --yes --environment=preview --token="$VERCEL_TOKEN"
      - name: Deploy Project Artifacts to Vercel
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_V6 }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          "$VERCEL_BIN" deploy --prebuilt --token="$VERCEL_TOKEN" packages/webapp
      # forwards status to telegram chat if this ci fails or gets canceled, only runs for default branch
      - name: Forward CI Status
        if: always()
        uses: rainlanguage/github-chore/.github/actions/telegram-status-report@main
        with:
          status: ${{ job.status }}
          telegram-bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
