# Release metadata, not foundry config. `[external.*]` is the namespace foundry
# reserves for other tools and ignores outright, so it raises no unknown-section
# warning and `forge config --fix` leaves it alone (a section foundry does not
# reserve is read as a profile, warned about on every invocation and rewritten
# into `[profile.*]` by the fixer).
#
# `version` is the LAST-published Soldeer release, not a next-version slot. A
# normal PR never moves it; only a release does, in lockstep with the frozen
# `src/generated/<tag>/` snapshot it names. `LibRainDeploySnapshot.deployTag()`
# reads it here when `script/Build.sol`'s `cutRelease()` runs, and rainix's
# `release-guard` checks it against the pushed `sol-v<version>` tag before
# anything publishes.
[external.package]
name = "raindex"
version = "0.1.13"

[profile.default]
src = 'src'
out = 'out'
# All Solidity dependencies are Soldeer-managed; no git submodules remain.
libs = ['dependencies']

# See more config options https://github.com/foundry-rs/foundry/tree/master/config

ffi = true
solc = "0.8.25"
evm_version = "cancun"

# optimizer settings for debugging
# via_ir = false
# optimizer = false
# optimizer_runs = 0
# optimizer_steps = 0

# optimizer settings for snapshotting.
optimizer = true
# Lowered from 1000000 → 1000 → 800 to stay under the EIP-170 24576-byte
# contract size limit. With the per-owner state overlay removed (untaken orders
# make no state change), RaindexV6 is 24,424 bytes at 800 runs (152 under).
optimizer_runs = 800

bytecode_hash = "none"
cbor_metadata = false

# Build metadata used for testing rain meta aware contracts in this folder rather
# than expose ffi to forge.
fs_permissions = [
  { access = "read", path = "./meta" },
  { access = "read-write", path = "./meta/RaindexV6SubParserAuthoringMeta.rain.meta" },
  # `script/Build.sol` writes the rolling candidate snapshot under
  # `src/generated/` and the generated released-suites libs under `src/lib/`.
  { access = "read-write", path = "./src" },
  { access = "read", path = "./subgraph" },
  # script/Build.sol reads `[external.package].version` to name the frozen
  # per-release snapshot dir.
  { access = "read", path = "foundry.toml" },
]

remappings = [
  # Custom remap so @openzeppelin packages' own internal imports resolve.
  "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.6.1/",
  # `rain-deploy` 0.1.7, and the `rain-sol-codegen` 0.1.36 it is built on,
  # spell forge-std as `forge-std-1.16.2/`; `rainlang` 0.1.5 and
  # `rain-interpreter-interface` 0.1.0 still spell it `forge-std-1.16.1/`.
  # Soldeer installs ONE version per package name, so the older prefix is
  # aliased onto the installed one. Not cosmetic: two forge-std copies in one
  # compilation are two DISTINCT `Vm` types, and a `vm` handed from one library
  # to another would not type check.
  #
  # These live here rather than in `remappings.txt` because `forge soldeer
  # install` owns that file and regenerates it from the installed set.
  "forge-std-1.16.1/=dependencies/forge-std-1.16.2/",
  # Same, for `rain-sol-codegen`. `rain-deploy` 0.1.7 needs 0.1.36, while
  # `rainlang` 0.1.5 and `rain-interpreter-interface` 0.1.0 import the
  # `IParserToolingV1` / `ISubParserToolingV1` / `IOpcodeToolingV1` /
  # `IIntegrityToolingV1` interfaces under the `rain-sol-codegen-0.1.0/`
  # prefix. Those four interfaces are byte-identical between the two versions
  # bar `pure` widening to `view` on three functions, which an implementation
  # is free to narrow again, so nothing here moves any contract's bytecode.
  "rain-sol-codegen-0.1.0/=dependencies/rain-sol-codegen-0.1.36/",
  # Same, for `rain-deploy`. `rainlang` 0.1.5's committed test abstracts
  # (`RainlangExpressionDeployerDeploymentTest`, reached from this repo's
  # tests) import `rain-deploy-0.1.2/src/lib/LibRainDeploy.sol` for
  # `etchZoltuFactory`/`deployZoltu`, which are unchanged in 0.1.7. Test-only:
  # nothing under `src/` reaches rain-deploy, so no contract bytecode moves.
  "rain-deploy-0.1.2/=dependencies/rain-deploy-0.1.7/",
]

[dependencies]
forge-std = "1.16.2"
"@openzeppelin-contracts" = "5.6.1"
# rainlanguage/rain.interpreter was renamed to rainlanguage/rainlang;
# its Soldeer registry name follows.
rainlang = "0.1.5"
rain-interpreter-interface = "0.1.0"
# rainlanguage/rain.raindex.interface was renamed to
# rainlanguage/raindex.interface; Soldeer registry name follows.
raindex-interface = "0.1.3"
rain-metadata = "0.1.0"
rain-intorastring = "0.1.0"
rain-sol-codegen = "0.1.36"
rain-solmem = "0.1.3"
rain-math-float = "0.1.1"
rain-tofu-erc20-decimals = "0.1.1"
rain-deploy = "0.1.7"
rain-lib-typecast = "0.1.0"
rain-lib-hash = "0.1.0"
rain-math-binary = "0.1.1"
rain-string = "0.2.0"
rain-lib-memkv = "0.1.0"

[soldeer]
recursive_deps = false

[fuzz]
runs = 5096

[rpc_endpoints]
arbitrum = "${ARBITRUM_RPC_URL}"
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
ethereum = "${ETHEREUM_RPC_URL}"
flare = "${FLARE_RPC_URL}"
hyperevm = "${HYPEREVM_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"

[etherscan]
arbitrum = { key = "${CI_DEPLOY_ARBITRUM_ETHERSCAN_API_KEY}" }
base = { key = "${CI_DEPLOY_BASE_ETHERSCAN_API_KEY}" }
base_sepolia = { key = "${CI_DEPLOY_BASE_SEPOLIA_ETHERSCAN_API_KEY}" }
ethereum = { key = "${CI_DEPLOY_ETHEREUM_ETHERSCAN_API_KEY}", chain = 1 }
flare = { key = "${CI_DEPLOY_FLARE_ETHERSCAN_API_KEY}" }
hyperevm = { key = "${CI_DEPLOY_HYPEREVM_ETHERSCAN_API_KEY}", chain = 999 }
polygon = { key = "${CI_DEPLOY_POLYGON_ETHERSCAN_API_KEY}" }
