[profile.default]
src = 'src'
out = 'out'
# 'dependencies' for soldeer-managed packages, 'lib' kept for the
# remaining git submodule (sushixswap-v2, which isn't on soldeer).
libs = ['dependencies', 'lib']

# See more config options https://github.com/foundry-rs/foundry/tree/master/config

ffi = true
solc = "0.8.25"
evm_version = "cancun"

# optimizer settings for debugging
# via_ir = false
# optimizer = false
# optimizer_runs = 0
# optimizer_steps = 0

# optimizer settings for snapshotting.
optimizer = true
# Lowered from 1000000 → 1000 → 800 to stay under the EIP-170 24KB contract
# size limit. At 1000 runs RaindexV6 was 24,650 bytes (74 over); at 800 it
# is 23,437 bytes (1,139 under).
optimizer_runs = 800

bytecode_hash = "none"
cbor_metadata = false

# Build metadata used for testing rain meta aware contracts in this folder rather
# than expose ffi to forge.
fs_permissions = [
  { access = "read", path = "./meta" },
  { access = "read", path = "./lib/rain.interpreter/meta/RainterpreterExpressionDeployerNPE2.rain.meta" },
  { access = "read", path = "./lib/rain.interpreter/deployments/latest/RainterpreterParserNPE2" },
  { access = "read", path = "./lib/rain.interpreter/deployments/latest/RainterpreterStoreNPE2" },
  { access = "read", path = "./lib/rain.interpreter/deployments/latest/RainterpreterNPE2" },
  { access = "read", path = "./lib/rain.interpreter/deployments/latest/RainterpreterExpressionDeployerNPE2" },
  { access = "read-write", path = "./meta/RaindexV6SubParserAuthoringMeta.rain.meta" },
  { access = "read-write", path = "src/generated" },
  { access = "read", path = "./subgraph" },
]

remappings = [
  # Custom remap so @openzeppelin packages' own internal imports resolve.
  "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.6.1/",
  # Submodule for sushixswap-v2 (not on Soldeer).
  "sushixswap-v2/=lib/sushixswap-v2/",
]

[dependencies]
forge-std = "1.16.1"
"@openzeppelin-contracts" = "5.6.1"
# rainlanguage/rain.interpreter was renamed to rainlanguage/rainlang;
# its Soldeer registry name follows.
rainlang = "0.1.2"
rain-interpreter-interface = "0.1.0"
# rainlanguage/rain.raindex.interface was renamed to
# rainlanguage/raindex.interface; Soldeer registry name follows.
raindex-interface = "0.1.1"
rain-metadata = "0.1.0"
rain-intorastring = "0.1.0"
rain-sol-codegen = "0.1.0"
rain-solmem = "0.1.3"
rain-math-float = "0.1.1"
rain-tofu-erc20-decimals = "0.1.1"
rain-deploy = "0.1.2"
rain-lib-typecast = "0.1.0"
rain-lib-hash = "0.1.0"
rain-math-binary = "0.1.1"
rain-string = "0.2.0"
rain-lib-memkv = "0.1.0"
rain-math-fixedpoint = "0.1.0"

[soldeer]
recursive_deps = false

[fuzz]
runs = 5096

[rpc_endpoints]
arbitrum = "${CI_DEPLOY_ARBITRUM_RPC_URL}"
base = "${CI_DEPLOY_BASE_RPC_URL}"
base_sepolia = "${CI_DEPLOY_BASE_SEPOLIA_RPC_URL}"
flare = "${CI_DEPLOY_FLARE_RPC_URL}"
polygon = "${CI_DEPLOY_POLYGON_RPC_URL}"

[etherscan]
arbitrum = { key = "${CI_DEPLOY_ARBITRUM_ETHERSCAN_API_KEY}" }
base = { key = "${CI_DEPLOY_BASE_ETHERSCAN_API_KEY}" }
base_sepolia = { key = "${CI_DEPLOY_BASE_SEPOLIA_ETHERSCAN_API_KEY}" }
flare = { key = "${CI_DEPLOY_FLARE_ETHERSCAN_API_KEY}" }
polygon = { key = "${CI_DEPLOY_POLYGON_ETHERSCAN_API_KEY}" }
