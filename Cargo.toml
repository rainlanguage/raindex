[workspace]
members = ["crates/*"]
exclude = ["lib/rain.interpreter", "lib/rain.raindex.interface"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "LicenseRef-DCL-1.0"
version = "0.0.0-alpha.0"
homepage = "https://github.com/rainlanguage/raindex"

[workspace.dependencies]
foundry-block-explorers = "0.2.6"
alloy = { version = "1.0.9", features = ["sol-types", "json", "json-abi"] }
anyhow = "1.0.70"
async-trait = "0.1.77"
clap = { version = "4.2.5", features = ["cargo", "derive"] }
once_cell = "1.17.1"
reqwest = { version = "0.12.5", features = ["json"] }
rust-bigint = "1.2.0"
serde = "1.0.200"
futures = "0.3.17"
serde_bytes = "0.11.9"
serde_json = "1.0.112"
serde_yaml = "0.9.32"
tokio = { version = "1.28.0" }
tracing = "0.1.37"
tracing-subscriber = "0.3.17"
url = "2.5.7"
comfy-table = "7.1.0"
cynic-codegen = { version = "3.4.0", features = ["rkyv"] }
cynic = "3.7.3"
chrono = "0.4.31"
thiserror = "1.0.56"
strict-yaml-rust = "0.1.2"
dotrain = "6.0.1-alpha.24"
dotrain-lsp = "6.0.1-alpha.24"
rain-metadata = "0.1.1"
rain-metadata-bindings = "0.1.5"
rain-metaboard-subgraph = "0.1.3"
rain_interpreter_bindings = { package = "rainlang_bindings", version = "0.1.15" }
rain_interpreter_dispair = { package = "rainlang_dispair", version = "0.1.10" }
rain_interpreter_parser = { package = "rainlang_parser", version = "0.1.3" }
rain-interpreter-eval = { package = "rainlang-eval", version = "0.1.2" }
csv = "1.3.0"
insta = { version = "1.34.0" }
proptest = "1.4.0"
derive_builder = "0.20.0"
thirtyfour = "0.31.0"
test-context = "0.3.0"
portpicker = "0.1.1"
rain-erc = "0.1.1"
rain-math-float = "0.1.6"
rain-error-decoding = "0.1.2"
# Direct dep required: the #[wasm_bindgen] macro emits `::wasm_bindgen` paths, and
# without a direct dep the 0.2.122 macro recurses without bound on opaque-class
# structs. Crates with bare #[wasm_bindgen] structs (common, js_api) depend on this.
wasm-bindgen = "0.2.122"
wasm-bindgen-utils = "0.1.2"
tempfile = "3.20.0"
eyre = "0.6.12"
tower = "0.5.2"
getrandom = { version = "0.2", features = ["js"] }
itertools = "0.14.0"

[workspace.dependencies.raindex_bindings]
path = "crates/bindings"

[workspace.dependencies.raindex_common]
path = "crates/common"

[workspace.dependencies.raindex_cli]
path = "crates/cli"

[workspace.dependencies.raindex_subgraph_client]
path = "crates/subgraph"

[workspace.dependencies.raindex_app_settings]
path = "crates/settings"

[workspace.dependencies.raindex_quote]
path = "crates/quote"

[workspace.dependencies.raindex_test_fixtures]
path = "crates/test_fixtures"

[workspace.dependencies.raindex_math]
path = "crates/math"

[workspace.dependencies.raindex_js_api]
path = "crates/js_api"

[workspace.dependencies.raindex_rest_api]
path = "crates/rest_api"

# release profile for wasm build optimized for size reduction
[profile.release-wasm]
inherits = "release"
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
rpath = false
debug = false
incremental = false
overflow-checks = false
debug-assertions = false
split-debuginfo = "packed"
